footer:
  style: compact
llm:
  policy: auto
  models:
  - id: local-fast
    enabled: true
    provider: ollama
    url: http://127.0.0.1:11434
    model: qwen2.5-coder:7b
    locality: local
    billing: free
    profiles:
    - classify
    - compress
    - generate
  - id: cloud
    enabled: true
    provider: ollama
    url: https://ollama.qa.guru
    model: qwen2.5-coder:7b
    locality: remote
    billing: free
    profiles:
    - cloud
  - id: heavy
    enabled: true
    provider: ollama
    url: https://ollama.qa.guru
    model: qwen3-coder:30b
    locality: remote
    billing: free
    profiles:
    - heavy
  cheap:
    default_id: local-fast
    selection: auto
routes:
- id: tool-jq-users-keys
  target: tool
  tool: jq
  read_only: true
  patterns:
  - jq
  - json field
  - parse json
  json_path: lab/users.json
  jq_filter: map(keys)
  note: Schema keys via jq — 0 LLM, no address list
- id: python-check-users-keys
  target: python
  read_only: true
  patterns:
  - python check users keys
  - check users keys
  - у каждого объекта есть id и email
  - lab/users.json у каждого объекта
  - каждого объекта есть id
  - в lab/users.json у каждого объекта есть id и email
  command: python3 lab/check_users.py lab/users.json
  note: шаг 4 — lab/check_users.py is SSOT
